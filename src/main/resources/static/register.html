<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SkillSwap</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #635bdb, #9388ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 420px;
            max-width: 100%;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #4444;
        }

        h1 {
            text-align: center;
            color: #635bdb;
        }

        p {
            text-align: center;
            color: #666;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #635bdb;
        }

        .password-box {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .password-box input {
            flex: 1;
        }

        .show-password {
            width: auto;
            padding: 12px;
            margin: 10px 0;
            background: #e5e7eb;
            color: #333;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #635bdb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #483fc0;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        a {
            color: #635bdb;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Join SkillSwap!</h1>

    <p>Create your account and start learning.</p>

    <form id="registerForm">

        <input type="text" name="name"
               placeholder="Full Name" required
               maxlength="100">

        <input type="email" name="email"
               placeholder="Email Address" required>

        <div class="password-box">
            <input type="password" id="password"
                   name="password"
                   placeholder="Create Password"
                   minlength="8" required>

            <button type="button"
                    class="show-password"
                    onclick="togglePassword()">
                Show
            </button>
        </div>

        <input type="text" name="skillToTeach"
               placeholder="Skill You Can Teach" required>

        <input type="text" name="skillToLearn"
               placeholder="Skill You Want to Learn" required>

        <button type="submit" id="registerButton">
            Create Account
        </button>

    </form>

    <p id="message"></p>

    <p>Already have an account?
        <a href="login.html">Login</a>
    </p>
